# MoDISco environment for motif discovery
# Usage: conda env create -f environment_modisco.yml
name: modisco_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - h5py
  - tqdm
  - meme=5.5.7
  - perl
  - pip
  - pip:
    - modisco-lite==2.3.2
    - contourpy
    - cycler
    - fonttools
    - igraph
    - kiwisolver
    - leidenalg
    - llvmlite
    - numba
    - packaging
    - pillow
    - pyparsing
    - python-dateutil
    - pytz
    - texttable
    - threadpoolctl
    - tzdata