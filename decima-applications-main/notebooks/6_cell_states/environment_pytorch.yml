# PyTorch environment for attribution analysis
# Usage: conda env create -f environment_pytorch.yml
name: pytorch
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.4
  - pip
  - pip:
    # Core ML
    - torch==2.5.1
    - pytorch-lightning==2.4.0
    - captum==0.5.0
    - torchmetrics==1.5.1
    # Data science
    - numpy==1.26.4
    - pandas==2.2.3
    - scipy==1.14.1
    - scikit-learn==1.5.2
    # Single-cell genomics
    - anndata==0.10.9
    - scanpy==1.11.0
    # Genomics tools
    - genomepy==0.16.1
    - pyfaidx==0.8.1.3
    - pybigwig==0.3.23
    - biopython==1.84
    # Motif analysis
    - tangermeme==0.4.1
    # Visualization
    - matplotlib==3.9.2
    - seaborn==0.13.2
    - plotnine==0.14.0
    # Utilities
    - tqdm==4.66.6
    - h5py==3.12.1
    - pyyaml==6.0.2
    # Experiment tracking
    - wandb==0.18.5
    - tensorboard==2.19.0
   
    # Custom packages (may need special installation - see README)
    #- grelu>=1.0.2 -> install from step repository on CZBiohub GitHub.